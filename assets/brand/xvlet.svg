<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>xvlet</title>
  <!-- xvlet's mark (tools/mark.py): an x of two arcs back to back. One
       colour: currentColor (the CSS variable ink). Parts: #left, #right. -->
  <g style="fill:none;stroke:var(--ink, currentColor);stroke-width:66;stroke-linecap:round">
    <path id="left" d="M119.0 82.8 A200 200 0 0 1 119.0 429.2"/>
    <path id="right" d="M393.0 429.2 A200 200 0 0 1 393.0 82.8"/>
  </g>
</svg>
